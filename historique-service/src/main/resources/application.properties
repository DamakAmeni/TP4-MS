spring.application.name=historique-service
server.port=8082

# Adresse de l'annuaire Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# Reglages pour le TP : rafraichir vite la liste des instances de calcul-service
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s

# Swagger derriere la passerelle
server.forward-headers-strategy=framework

# Recalculer l'adresse du serveur dans la description OpenAPI a chaque requete
springdoc.cache.disabled=true

eureka.instance.ip-address=127.0.0.1

# Jackson 3 (Spring Boot 4) : accepter un champ absent pour un type primitif (id, resultat)
spring.jackson.deserialization.fail-on-null-for-primitives=false