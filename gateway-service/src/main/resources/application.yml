server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Le prefixe est pose a la main plus bas (discovery.locator.filters)
          x-forwarded:
            prefix-enabled: false
          # Transmet aux microservices le Host d'origine (localhost:8888)
          default-filters:
            - PreserveHostHeader
          # routes: ... (en commentaire depuis l'etape E.4)
          discovery:
            locator:
              # Une route par service present dans l'annuaire
              enabled: true
              # Noms Eureka en majuscules ; acceptes en minuscules dans l'URI
              lower-case-service-id: true
              # Filtres de chaque route dynamique :
              # 1) retirer le prefixe /xxx, 2) annoncer ce prefixe au microservice
              filters:
                - name: RewritePath
                  args:
                    regexp: "'/' + serviceId + '/?(?<remaining>.*)'"
                    replacement: "'/${remaining}'"
                - name: SetRequestHeader
                  args:
                    name: "'X-Forwarded-Prefix'"
                    value: "'/' + serviceId"
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    # Adresse fixe : evite l'adresse 169.254.x.x choisie quand le reseau change
    ip-address: 127.0.0.1
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: gateway,health
  endpoint:
    gateway:
      access: read-only

# Swagger UI de la passerelle : http://localhost:8888/swagger-ui.html
springdoc:
  swagger-ui:
    urls:
      - name: calcul-service
        url: /calcul-service/v3/api-docs
      - name: historique-service
        url: /historique-service/v3/api-docs